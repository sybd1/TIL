        // 문제 1. 수량 조절하기
        function QuantityCounter() {
            // TODO: 초기값이 0인 quantity state를 만드세요.
            const [numbur, setNumber] = useState(0);

            const handleIncrease = () => {
                // TODO: quantity를 1 증가시키세요.

            };

            const handleDecrease = () => {
                // TODO: quantity가 0보다 클 때만 1 감소시키세요.
                if (numbur > 0) {
                    setNumber(numbur - 1);
                }
            };

            const handleReset = () => {
                // TODO: quantity를 0으로 변경하세요.
                setNumber((quantity) => 0);
            };

            return (
                <section className="problem">
                    <h2>문제 1. 수량 조절하기</h2>
                    <ul className="requirements">
                        <li><code>useState(0)</code>으로 수량 상태를 만듭니다.</li>
                        <li>증가 버튼은 수량을 1 증가시킵니다.</li>
                        <li>감소 버튼은 수량이 0보다 클 때만 1 감소시킵니다.</li>
                        <li>초기화 버튼은 수량을 0으로 변경합니다.</li>
                    </ul>
                    <h3>현재 수량: {numbur}</h3>
                    <div className="controls">
                        <button onClick={handleDecrease}>-1</button>
                        <button onClick={handleIncrease}>+1</button>
                        <button onClick={handleReset} className="secondary">초기화</button>
                    </div>
                </section>
            );
        }
