<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- <script src="https://unpkg.com/axios/dist/axios.min.js"></script> -->
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        const API_URL = 'https://api.github.com/emojis'

        const { useState, useEffect } = React;

        // 검색창에 글자를 입력하고 검색 버튼을 누르는 곳
        function SearchBox({ onSearch }) {
            const [keyword, setKeyword] = useState('');

            // 검색 버튼 눌렀을 때 실행할 함수
            const onButtonClick = () => {
                onSearch(keyword);  // 부모에게 사용자가 입력한 검색어 전달
            };
            return (
                <div>
                    <input
                        type="text"
                        placeholder="이모지 이름을 입력하세요."
                        value={keyword}
                        onChange={(e) => setKeyword(e.target.value)}
                    />
                    <button onClick={onButtonClick}>검색</button>
                </div>
            );
        }

        // 검색창 하단에 이미지 뜨게 하는 곳
        function ImageBox({ imgUrl }) {
            // 만약 이미지를 불러오는데 실패했으면 텍스트를 보여준다.
            if (!imgUrl) {
                return <p>제대로 된 이모지 이름을 검색해보세요.</p>
            }
            return (
                <>
                    <div>
                        <img
                        src={imgUrl}    // 부모가 인터넷 사진 주소를 찾아와 여기에 넣어준다.
                        alt="검색된 이모지"
                        style={{width: '120px', height: '120px'}}
                        />
                    </div>
                </>
            )
        }

        function App() {
            const [emojis, setEmojis] = useState({});
            const [imgUrl, setImgUrl] = useState('');

            // 빈 의존성 배열 useEffect 함수는 마운트 될 때 한 번만 실행시킨다.
            useEffect(() => {
                fetch(API_URL)  // api 주소 요청 보냄
                    .then(res => res.json())    // JS가 사용할 수 있는 객체로 변환 (json은 받아온 순수텍스트)
                    .then(data => {     // 변환 되어 사용할 수 있는 데이터를 setEmojis(data)에 저장
                        setEmojis(data);
                    });
            }, []);

            const findEmoji = (word) => {   // 사용자가 입력한 글자
                if (emojis[word]) {     // 사용자가 fire을 입력하면 위에서 불러온 emojis 객체 안에서 fire을 찾는다.
                    setImgUrl(emojis[word]);    // emojis 객체 주소값 imgUrl에 할당
                } else {
                    alert('없는 이모지에요.');  // 없으면 이 알림창
                }
            }
            return (
                <>
                    <h1>이모지 검색기</h1>

                    <SearchBox onSearch={findEmoji} />
                    <br />
                    <ImageBox imgUrl={imgUrl} />    {/* 입력받고 객체에서 찾아 불러온 주소값을 자식에게 보낸다. */}
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>

</html>
