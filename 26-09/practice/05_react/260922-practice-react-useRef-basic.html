<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 단어장 실습</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f4f6fa;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #dfe4ea;
            max-width: 450px;
        }

        .input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
        }

        button {
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: #315efb;
            color: white;
            cursor: pointer;
        }

        button.delete {
            background: #d63031;
            padding: 4px 8px;
            font-size: 13px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .count {
            color: #596275;
            margin-bottom: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function VocabularyApp() {
            // 여기에 상태, Ref, 이벤트 핸들러를 작성하십시오.
            const [inputText, setInputText] = useState('');
            const [nextId, setNextId] = useState(3);
            const [words, setWords] = useState([
                { id: 1, text: 'React' }, { id: 2, text: 'State' }
            ]);

            const inputRef = useRef(null);
            

            const handleAddBtn = () => {
                if (inputText.trim() === '') {
                    return;
                }

                const newWord = { id: nextId, text: inputText };

                setWords([...words, newWord]);

                setNextId(nextId + 1);

                setInputText('');

                inputRef.current.focus();
            }

            const handleDelete = (idToDelete) => {
                setWords(words.filter(word => word.id !== idToDelete));
            };



            


            return (
                <div className="card">
                    <h2>스마트 단어장</h2>
                    <div className="count">등록된 단어: {words.length}</div>

                    <div className="input-box">
                        <input
                            ref={inputRef}
                            type="text"
                            placeholder="새 단어 입력"
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                        />
                        <button onClick={handleAddBtn}>추가</button>
                    </div>

                    <ul>
                        {words.map(word => (
                            <li key={word.id}>
                                <span>{word.text}</span>
                                <button className="delete" onClick={() => handleDelete(word.id)}>삭제</button>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<VocabularyApp />);
    </script>
</body>

</html>
