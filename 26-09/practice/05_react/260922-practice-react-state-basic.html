<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기초 State 응용 실습</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f4f6fa;
        }

        .order-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #dfe4ea;
            max-width: 400px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin: 16px 0;
            align-items: center;
        }

        button {
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: #315efb;
            color: white;
            cursor: pointer;
        }

        button.secondary {
            background: #596275;
        }

        input {
            padding: 8px 12px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .field {
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function CafeOrderApp() {
            // 여기에 상태(State) 및 이벤트 핸들러 함수를 작성하십시오.
            const [count, setCount] = useState(1);
            const [user, setUser] = useState('');

            const handleIncrease = () => {
                setCount(count + 1);
            }

            const handleDecrease = () => {
                if (count > 1) {
                    setCount(count - 1);
                }
            };

            const resetBtn = () => {
                setCount(1);
            }

            const handleOrder = () => {
                if (user.trim() === '') {
                    alert('주문자 이름을 입력해주세요.');
                    return;
                }
                alert(`${user}아, 아메리카노 ${count}잔 나왔다. 얼른 들고가라.`);
                setUser('');
                setCount(1);
            }

            return (
                <div className="order-card">
                    <h2>카페 주문 관리</h2>

                    <div className="field">
                        <label>주문자 이름</label>
                        <input
                            type="text"
                            placeholder="이름을 입력하세요"
                            value={user}
                            onChange={(e) => setUser(e.target.value)}
                        />
                    </div>

                    <div className="field">
                        <label>수량: {count}잔</label>
                        <div className="controls">
                            <button onClick={handleDecrease}>-1</button>
                            <button onClick={handleIncrease}>+1</button>
                            <button className="secondary" onClick={resetBtn}>초기화</button>
                        </div>
                    </div>

                    <button style={{ width: '100%' }} onClick={handleOrder}>주문하기</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CafeOrderApp />);
    </script>
</body>

</html>
