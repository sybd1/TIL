<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Todo List 실습</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 60px 20px;
            color: #222;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f4f6fa;
        }

        #root {
            width: min(680px, 100%);
        }

        .practice-guide,
        .todo-app {
            padding: 24px;
            border: 1px solid #dfe4ea;
            border-radius: 14px;
            background: white;
        }

        .practice-guide {
            margin-bottom: 24px;
        }

        .practice-guide h1 {
            margin-top: 0;
        }

        .requirements {
            padding: 16px 18px 16px 38px;
            border-radius: 8px;
            line-height: 1.7;
            background: #f1f4ff;
        }

        .todo-app h2 {
            margin-top: 0;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 9px 14px;
            border: 0;
            border-radius: 6px;
            color: white;
            background: #315efb;
            cursor: pointer;
        }

        .todo-list {
            padding: 0;
            list-style: none;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid #dfe4ea;
            border-radius: 8px;
        }

        .todo-item button {
            background: #d63031;
        }

        .count {
            color: #596275;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 할 일 한 개를 화면에 표시하는 자식 컴포넌트
        function TodoItem({ todo, onRemove }) {
            return (
                <li className="todo-item">
                    {/* TODO 1. todo의 할 일 내용을 출력하세요. */}
                    <span>{todo.text}</span>

                    {/*
                        TODO 2.
                        삭제 버튼을 클릭하면
                        onRemove 함수에 todo.id를 전달하세요.

                        임시로 빈 화살표 함수가 연결되어 있습니다.
                        이 함수를 알맞은 코드로 변경하세요.
                    */}
                    <button onClick={() => onRemove(todo.id)}>
                        삭제
                    </button>
                </li>
            );
        }

        // 할 일 목록과 상태를 관리하는 부모 컴포넌트
        function TodoList() {
            /*
                TODO 3.
                입력값을 저장할 inputText state를 만드세요.
                초기값은 빈 문자열입니다.

                작성 형태:
                const [상태값, 상태변경함수] = useState(초기값);
            */
            const [inputText, setInputText] = useState('');

            /*
                TODO 4.
                할 일 목록을 저장할 todos state를 만드세요.

                초기값은 다음 객체 두 개를 가진 배열입니다.

                { id: 1, text: 'React 복습하기' }
                { id: 2, text: 'Todo List 완성하기' }
            */
            const [todos, setTodos] = useState([
                { id: 1, text: 'React 복습하기' },
                { id: 2, text: 'Todo List 완성하기' }
            ])
            /*
                TODO 5.
                다음 할 일의 id로 사용할 nextId state를 만드세요.
                초기값은 3입니다.
            */
            const [nextId, setNextId] = useState(3);

            const handleChange = (event) => {
                /*
                    TODO 6.
                    input의 현재 값을 inputText state에 저장하세요.

                    input의 현재 값:
                    event.target.value
                */
                setInputText(event.target.value);
            };

            const handleAdd = () => {
                /*
                    TODO 7.
                    inputText의 앞뒤 공백을 제거했을 때
                    빈 문자열이면 함수를 종료하세요.

                    힌트:
                    inputText.trim()
                */
                if (inputText.trim() === '') return;
                /*
                    TODO 8.
                    id와 text를 가진 새로운 할 일 객체를 만드세요.

                    id에는 nextId,
                    text에는 inputText를 사용합니다.
                */
                const newTodo = { id: nextId, text: inputText };
                /*
                    TODO 9.
                    기존 todos를 직접 수정하지 말고
                    Spread 문법으로 새로운 배열을 만드세요.

                    새 배열에는 기존 할 일과 새로운 할 일이
                    모두 들어가야 합니다.
                */
                setTodos([...todos, newTodo]);

                /*
                    TODO 10.
                    nextId를 1 증가시키고
                    inputText를 빈 문자열로 초기화하세요.
                */
                setNextId(nextId + 1);
                setInputText('');
                //     TODO 10.
                //     nextId를 1 증가시키고
                //     inputText를 빈 문자열로 초기화하세요.
                // */
            };

            const handleRemove = (id) => {
                /*
                    TODO 11.
                    filter()를 사용하여 전달받은 id와
                    다른 할 일만 남긴 새로운 배열을 만드세요.

                    완성한 배열을 setTodos에 전달합니다.
                */
                const filterText = todos.filter(todo => todo.id !== id)
                setTodos(filterText);
            };

            return (
                <>
                    <section className="practice-guide">
                        <h1>React Todo List 실습</h1>

                        <ol className="requirements">
                            <li>
                                input의 값은 <code>inputText</code> state로
                                관리합니다.
                            </li>
                            <li>
                                할 일 목록은 객체 배열 형태의
                                <code>todos</code> state로 관리합니다.
                            </li>
                            <li>
                                추가 버튼을 누르면 새로운 할 일을 기존 목록
                                뒤에 추가합니다.
                            </li>
                            <li>
                                공백만 입력한 경우에는 할 일을 추가하지
                                않습니다.
                            </li>
                            <li>
                                <code>map()</code>으로 목록을 렌더링하고
                                각 항목에 고유한 <code>key</code>를 지정합니다.
                            </li>
                            <li>
                                삭제 버튼을 누르면 <code>filter()</code>로
                                해당 할 일을 제외합니다.
                            </li>
                            <li>
                                할 일 한 개의 화면은 자식 컴포넌트인
                                <code>TodoItem</code>이 담당합니다.
                            </li>
                            <li>
                                부모는 자식에게 <code>todo</code>와
                                <code>handleRemove</code>를 props로 전달합니다.
                            </li>
                            <li>
                                자식은 삭제 버튼을 클릭하면 전달받은 함수에
                                <code>todo.id</code>를 전달합니다.
                            </li>
                        </ol>
                    </section>

                    <main className="todo-app">
                        <h2>오늘의 할 일</h2>

                        <div className="input-area">
                            {/*
                                TODO 12.
                                value의 빈 문자열을 inputText로 변경하세요.

                                TODO 13.
                                onChange의 빈 함수를 handleChange로 변경하세요.
                            */}
                            <input
                                type="text"
                                placeholder="할 일을 입력하세요"
                                value={inputText}
                                onChange={handleChange}
                            />

                            {/*
                                TODO 14.
                                onClick의 빈 함수를 handleAdd로 변경하세요.
                            */}
                            <button onClick={() => { handleAdd() }}>
                                추가
                            </button>
                        </div>

                        {/*
                            TODO 15.
                            숫자 0 대신 todos 배열의 개수를 출력하세요.
                        */}
                        <p className="count">
                            남은 할 일: {todos.length}
                        </p>

                        <ul className="todo-list">
                            {todos.map(todo => (
                                <TodoItem
                                    key={todo.id}
                                    todo={todo}
                                    onRemove={handleRemove}
                                />
                            ))}
                        </ul>
                    </main>
                </>
            );
        }

        ReactDOM
            .createRoot(document.getElementById('root'))
            .render(<TodoList />);
    </script>
</body>

</html>
